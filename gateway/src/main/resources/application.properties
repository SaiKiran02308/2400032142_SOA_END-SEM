spring.application.name=gateway
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8000/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.routes[0].id=driver-service-route
spring.cloud.gateway.routes[0].uri=lb://DRIVERSERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/drivers/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
